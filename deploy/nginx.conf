# 裸机部署用的 nginx 站点配置：
#   /            → 前端构建产物（frontend/dist 发布到 WEB_ROOT）
#   /api/        → 后端（127.0.0.1:8000，由 systemd 托管的 uvicorn）
#
# 用法：
#   1. 把 server_name 改成你的域名
#   2. 把 root 改成部署脚本里的 WEB_ROOT（默认 /var/www/poManagementSystem）
#   3. sudo cp deploy/nginx.conf /etc/nginx/sites-available/poManagementSystem
#      sudo ln -s /etc/nginx/sites-available/poManagementSystem /etc/nginx/sites-enabled/
#      sudo nginx -t && sudo systemctl reload nginx
#
# TLS：把 80 端口的这段配置留作 ACME 校验用，另配 443 的 server 块并签发证书。

server {
    listen 80;
    server_name po-management.example.com;   # ← 改成你的域名

    root /var/www/poManagementSystem;
    index index.html;

    access_log /var/log/nginx/poManagementSystem.access.log;
    error_log  /var/log/nginx/poManagementSystem.error.log;

    # 单页应用用的是 hash 路由（/#/shipments/6），但仍留一条回退，
    # 免得将来改成 history 路由时深链接 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带内容指纹的构建产物可以长期缓存
    location /assets/ {
        # 构建产物的文件名带内容哈希，可以长期缓存
        expires 30d;
    }

    # index.html 不缓存：发版后必须立刻拿到新版本
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 导出 Excel 可能稍慢，给宽一点
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 上传 CSV 的请求体不大，但批量导入的 CSV 可能有几 MB
    client_max_body_size 8m;
}
